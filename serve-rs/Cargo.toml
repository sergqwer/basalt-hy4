[workspace]
resolver = "2"
members = [
    "crates/serve-text",
    "crates/serve-engine",
    "crates/serve-api",
    "crates/serve-http",
    "crates/basalt-serve",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
indexmap = "2"
libc = "0.2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Console", "Win32_System_SystemInformation"] }
serve-text = { path = "crates/serve-text" }
serve-engine = { path = "crates/serve-engine" }
serve-api = { path = "crates/serve-api" }
serve-http = { path = "crates/serve-http" }

[profile.release]
opt-level = 3
debug = false
